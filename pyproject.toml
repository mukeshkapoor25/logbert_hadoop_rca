[build-system]
requires = ["setuptools>=65.0", "wheel", "setuptools_scm[toml]>=7.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logbert-hadoop-rca"
version = "1.0.0"
description = "Intelligent Root Cause Analysis for Hadoop Clusters using LogBERT - A Deep Learning Approach"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Capstone Student", email = "student@university.edu"},
]
maintainers = [
    {name = "Capstone Student", email = "student@university.edu"},
]
keywords = [
    "machine-learning",
    "deep-learning",
    "bert", 
    "transformer",
    "log-analysis",
    "anomaly-detection",
    "root-cause-analysis",
    "hadoop",
    "distributed-systems",
    "devops",
    "sre",
    "capstone-project"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research", 
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.41.1",
    "fastapi>=0.110.0", 
    "uvicorn>=0.29.0",
    "pydantic>=2.6.4",
    "pandas>=2.1.0",
    "numpy>=1.24.4",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.0.0",
    "seaborn>=0.11.0",
    "tqdm>=4.66.1",
    "PyYAML>=6.0.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "huggingface-hub>=0.23.2",
    "accelerate>=0.30.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.3.1",
    "pytest-mock>=3.11.1",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "myst-parser>=2.0.0",
    "nbsphinx>=0.9.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0",
    "nbformat>=5.9.0",
    "plotly>=5.15.0",
    "ipywidgets>=8.0.0",
]
monitoring = [
    "prometheus-client>=0.17.0",
    "grafana-api>=1.0.3",
    "psutil>=5.9.0",
]
deployment = [
    "docker>=6.1.0",
    "kubernetes>=27.2.0",
    "gunicorn>=21.2.0",
]

[project.urls]
Homepage = "https://github.com/sanjeev07/logbert_hadoop_rca"
Documentation = "https://github.com/sanjeev07/logbert_hadoop_rca/wiki"
Repository = "https://github.com/sanjeev07/logbert_hadoop_rca.git"
"Bug Tracker" = "https://github.com/sanjeev07/logbert_hadoop_rca/issues"
"Research Paper" = "https://github.com/sanjeev07/logbert_hadoop_rca/blob/main/academic/research_paper.pdf"
"Capstone Documentation" = "https://github.com/sanjeev07/logbert_hadoop_rca/blob/main/CAPSTONE_OVERVIEW.md"

[project.scripts]
logbert-train = "src.scripts.train_model:main"
logbert-evaluate = "src.scripts.evaluate_model:main"
logbert-serve = "src.api.main:serve"
logbert-preprocess = "src.scripts.preprocess_data:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "docs*", "notebooks*", "legacy*"]

[tool.setuptools.package-data]
"src.data" = ["*.yaml", "*.json", "*.pkl"]
"src.models" = ["*.yaml", "*.json"]

# =============================================================================
# DEVELOPMENT TOOLS CONFIGURATION
# =============================================================================

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | legacy
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]
known_third_party = [
    "torch", 
    "transformers", 
    "fastapi", 
    "pandas", 
    "numpy", 
    "sklearn", 
    "matplotlib", 
    "seaborn"
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
skip_glob = ["legacy/*"]

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long (handled by black)
    "W503",  # line break before binary operator
]
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
    "legacy",
    "*.egg-info",
]
per-file-ignores = [
    "__init__.py:F401",  # imported but unused
    "tests/*:S101",      # use of assert
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
no_implicit_optional = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "sklearn.*",
    "matplotlib.*",
    "seaborn.*",
    "tqdm.*",
]
ignore_missing_imports = true

# =============================================================================
# TESTING CONFIGURATION
# =============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config", 
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=80",
    "-ra",
    "--tb=short",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "performance: Performance tests",
    "slow: Slow running tests",
    "gpu: Tests requiring GPU",
    "network: Tests requiring network access",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "*/conftest.py",
    "legacy/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# =============================================================================
# SECURITY TOOLS CONFIGURATION  
# =============================================================================

[tool.bandit]
exclude_dirs = ["tests", "legacy"]
skips = ["B101"]  # assert_used

[tool.safety]
ignore = []
full_report = true

# =============================================================================
# DOCUMENTATION CONFIGURATION
# =============================================================================

[tool.sphinx]
source_dir = "docs"
build_dir = "docs/_build"

# =============================================================================
# ACADEMIC PROJECT METADATA
# =============================================================================

[tool.academic]
project_type = "capstone"
degree_program = "Computer Science"  # Update as needed
institution = "University Name"      # Update as needed
academic_year = "2024-2025"         # Update as needed
advisor = "Dr. Advisor Name"        # Update as needed

[tool.academic.requirements]
min_test_coverage = 90
min_documentation_coverage = 95
required_sections = [
    "literature_review",
    "methodology", 
    "implementation",
    "evaluation",
    "results",
    "conclusion",
    "future_work"
]

[tool.academic.deliverables]
research_paper = "academic/research_paper.pdf"
technical_report = "academic/technical_report.pdf" 
presentation = "academic/presentation.pptx"
poster = "academic/poster.pdf"
demo_video = "academic/demo_video.mp4"
source_code = "."

# =============================================================================
# PERFORMANCE BENCHMARKS
# =============================================================================

[tool.benchmark]
min_throughput = 1000  # logs per second
max_latency = 500      # milliseconds
max_memory = 4096      # MB
min_accuracy = 0.95    # 95%

[tool.benchmark.hardware]
cpu_cores = 4
memory_gb = 8
gpu_memory_gb = 8
storage_type = "SSD"
